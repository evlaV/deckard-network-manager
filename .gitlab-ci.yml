# Valve pipeline: build this commit as holo's networkmanager package.

stages:
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Keep build dependencies and compiler output between pipelines. Each job gets
# its own cache since the build and test jobs compile with different flags.
.caches:
  variables:
    CCACHE_DIR: "${CI_PROJECT_DIR}/.cache/ccache"
    CCACHE_MAXSIZE: "1G"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .cache/
  before_script:
    - ./valve-ci/pacman-cache.sh restore .cache/pacman
    - ccache --zero-stats

networkmanager_build:
  extends: .caches
  stage: build
  image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-package-builder-main:latest
  variables:
    PKGDEST: "${CI_PROJECT_DIR}/local_repo"
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.steamos.cloud/deckard/deckardos/holo holo
    - ./valve-ci/use-this-commit.sh holo/deckard/networkmanager/PKGBUILD "${CI_COMMIT_SHA}"
    - git -C holo diff
    - ulimit -c 0
    - sudo pacman -Syy
    - ./holo/.ci_scripts/build_package.sh holo/deckard/networkmanager
    - ccache --show-stats
    - ./valve-ci/pacman-cache.sh save .cache/pacman
  tags:
    - aarch64-linux-docker
  artifacts:
    paths:
      - local_repo/*.pkg.tar.zst

networkmanager_format:
  stage: build
  image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-package-builder-main:latest
  variables:
    # The check compares against the upstream release tag
    GIT_DEPTH: 0
  script:
    # The checkout belongs to the runner, not the image's build user
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    - sudo pacman -Sy --noconfirm --needed clang python
    - ./valve-ci/check-format.sh
  tags:
    - aarch64-linux-docker

networkmanager_test:
  extends: .caches
  stage: build
  image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-package-builder-main:latest
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.steamos.cloud/deckard/deckardos/holo holo
    - ulimit -c 0
    - sudo pacman -Syy
    - ./valve-ci/run-tests.sh holo/deckard/networkmanager
    - ccache --show-stats
    - ./valve-ci/pacman-cache.sh save .cache/pacman
  tags:
    - aarch64-linux-docker
  artifacts:
    when: always
    paths:
      - build-tests/meson-logs/testlog.txt
